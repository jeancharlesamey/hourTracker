      const daysInMonth = new Date(linearViewYear, linearViewMonth + 1, 0).getDate();
      const firstDay = new Date(linearViewYear, linearViewMonth, 1);
      let startDow = firstDay.getDay() - 1;
      if (startDow < 0) startDow = 6;

      // Group days by week
      const weekGroups = {};
      const todayS = todayStr();
      const weekNumbers = [];

      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${linearViewYear}-${String(linearViewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (ds > todayS) break;
        const date = new Date(linearViewYear, linearViewMonth, d);
        const weekNum = getWeekOfYear(date);
        const row = Math.floor((d - 1 + startDow) / 7);

        if (!weekGroups[row]) {
          weekGroups[row] = [];
          weekNumbers[row] = weekNum;
        }
        weekGroups[row].push(ds);
      }

      const rows = Object.keys(weekGroups).sort((a,b) => a-b).map(r => weekGroups[r]);
      const weeksInMonth = rows.length;

      console.log('Weekly table data:', {
        weeksInMonth,
        rowsLength: rows.length,
        weekGroups: Object.keys(weekGroups).length
      });

      if (rows.length === 0) {
        console.log('No rows in week groups');
        el.innerHTML = `<p class="text-sm text-gray-400 dark:text-white/40 text-center py-6">No data for this month yet.</p>`;
        return;
      }

      const isHours = summaryCachingMode === 'hours';
      const isDays = summaryCachingMode === 'days';
      const isPct = summaryCachingMode === 'pct';

      // Filter tasks to only show those with hours in this month
      const tasksWithHours = tasks.filter((_, taskIndex) => hasHoursInMonth(taskIndex, linearViewYear, linearViewMonth))
        .sort((a, b) => {
          const idA = (a.idOpus || '').toString().toLowerCase();
          const idB = (b.idOpus || '').toString().toLowerCase();
          if (idA && !idB) return -1;
          if (!idA && idB) return 1;
          if (idA && idB) return idA.localeCompare(idB);
          return a.name.localeCompare(b.name);
        });

      // Group tasks by ID
      const groupedTasks = {};
      const groupOrder = [];
      tasksWithHours.forEach(task => {
        const id = task.idOpus || '(no ID)';
        if (!groupedTasks[id]) {
          groupedTasks[id] = [];
          groupOrder.push(id);
        }
        groupedTasks[id].push(task);
      });

      // Calculate total hours for percentage calculations
      let grandTotal = 0;
      tasksWithHours.forEach((task) => {
        const taskIndex = tasks.indexOf(task);
        rows.forEach(weekDates => {
          grandTotal += weekDates.reduce((sum, ds) => sum + getHours(ds, taskIndex), 0);
        });
      });

      let helperText = '';
      if (isHours) helperText = '0.25 = 15min · 0.5 = 30min · 0.75 = 45min';
      else if (isDays) helperText = `1 day = ${maxCap}h (daily cap)`;
      else if (isPct) helperText = 'share of total hours';

      // Update controls and helper in the card header
      const controlsEl = document.getElementById('weeklyBreakdownControls');
      if (controlsEl) {
        controlsEl.innerHTML = `
          <div class="inline-flex rounded-lg bg-black/5 dark:bg-white/5 p-0.5">
            <button onclick="setSummaryMode('hours')" class="px-3 py-1 text-xs font-medium rounded-md transition-colors ${isHours ? 'bg-white dark:bg-white/15 text-gray-900 dark:text-white shadow-sm' : 'text-gray-400 dark:text-white/40 hover:text-gray-600 dark:hover:text-white/60'}">Hours</button>
            <button onclick="setSummaryMode('days')" class="px-3 py-1 text-xs font-medium rounded-md transition-colors ${isDays ? 'bg-white dark:bg-white/15 text-gray-900 dark:text-white shadow-sm' : 'text-gray-400 dark:text-white/40 hover:text-gray-600 dark:hover:text-white/60'}">Days</button>
            <button onclick="setSummaryMode('pct')" class="px-3 py-1 text-xs font-medium rounded-md transition-colors ${isPct ? 'bg-white dark:bg-white/15 text-gray-900 dark:text-white shadow-sm' : 'text-gray-400 dark:text-white/40 hover:text-gray-600 dark:hover:text-white/60'}">%</button>
          </div>
        `;
      }

      const helperEl = document.getElementById('weeklyBreakdownHelper');
      if (helperEl) {
        helperEl.innerHTML = `<p class="text-[10px] text-gray-400 dark:text-white/30 text-right flex-shrink-0">${helperText}</p>`;
      }

      // Build table
      let html = `<div class="overflow-x-auto">
          <table class="w-full text-sm table-fixed">
            <thead>
              <tr class="border-b border-gray-200 dark:border-white/10">
                <th class="text-left py-2 px-3 font-semibold text-gray-900 dark:text-white w-4/5">Task</th>
      `;

      rows.forEach((_, i) => {
        const weekNum = weekNumbers[i];
        const colWidth = (3 / (4 * (rows.length + 1))) * 100;
        html += `<th class="text-right py-2 px-3 font-semibold text-gray-900 dark:text-white text-xs whitespace-nowrap" style="width: ${colWidth}%">W${weekNum}</th>`;
      });

      html += `
                <th class="text-right py-2 px-3 font-semibold text-gray-900 dark:text-white text-xs" style="width: ${(3 / (4 * (rows.length + 1))) * 100}%">Total</th>
              </tr>
            </thead>
            <tbody>
      `;

      groupOrder.forEach(groupId => {
        const groupTasks = groupedTasks[groupId];
        const isMissingId = groupId === '(no ID)';

        // Only show group header if group has an ID
        if (!isMissingId) {
          // Calculate group totals
          let groupMonthTotal = 0;
          const groupWeekTotals = rows.map(weekDates => {
            const weekTotal = groupTasks.reduce((sum, task) => {
              const taskIndex = tasks.indexOf(task);
              return sum + weekDates.reduce((s, ds) => s + getHours(ds, taskIndex), 0);
            }, 0);
            groupMonthTotal += weekTotal;
            return weekTotal;
          });

          // Group header row
          html += `<tr class="border-b border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5">
            <td class="py-2 px-3 font-semibold text-gray-900 dark:text-white text-xs">${groupId}</td>
          `;

          groupWeekTotals.forEach((hours) => {
            let display = '—';
            if (hours > 0) {
              if (isHours) display = fmtH(hours);
              else if (isDays) display = fmtD(hours);
              else if (isPct) display = fmtPct(hours, grandTotal);
            }
            const colWidth = (3 / (4 * (rows.length + 1))) * 100;
            html += `<td class="text-right py-2 px-3 font-semibold text-gray-700 dark:text-white/80 text-xs" style="width: ${colWidth}%">${display}</td>`;
          });

          let groupTotalDisplay = '—';
          if (groupMonthTotal > 0) {
            if (isHours) groupTotalDisplay = fmtH(groupMonthTotal);
            else if (isDays) groupTotalDisplay = fmtD(groupMonthTotal);
            else if (isPct) groupTotalDisplay = fmtPct(groupMonthTotal, grandTotal);
          }

          const totalColWidth = (3 / (4 * (rows.length + 1))) * 100;
          html += `<td class="text-right py-2 px-3 font-semibold text-gray-900 dark:text-white text-xs" style="width: ${totalColWidth}%">${groupTotalDisplay}</td>
          </tr>`;
        }

        // Individual task rows within group (or standalone if no ID)
        groupTasks.forEach((task) => {
          const taskIndex = tasks.indexOf(task);
          let monthTotal = 0;
          const weekTotals = rows.map(weekDates => {
            const weekTotal = weekDates.reduce((sum, ds) => sum + getHours(ds, taskIndex), 0);
            monthTotal += weekTotal;
            return weekTotal;
          });

          const taskLink = task.jiraLink ? `<a href="${task.jiraLink}" target="_blank" class="text-blue-600 dark:text-white hover:underline">${task.name}</a>` : task.name;
          const colorCircle = `<div class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background: ${COLOR_HEX[task.color]}"></div>`;
          const paddingLeft = isMissingId ? '' : 'padding-left: 2rem;';
          const rowClass = isMissingId ? 'border-b border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5' : 'border-b border-gray-100 dark:border-white/5 hover:bg-black/5 dark:hover:bg-white/5';
          const cellClass = isMissingId ? 'py-2 px-3 font-semibold text-gray-900 dark:text-white text-xs flex items-center gap-2.5 w-4/5 overflow-hidden' : 'py-2 px-3 text-gray-900 dark:text-white flex items-center gap-2.5 w-4/5 overflow-hidden';

          html += `<tr class="${rowClass}">
            <td class="${cellClass}" style="${paddingLeft}">${colorCircle}${taskLink}</td>
          `;

          weekTotals.forEach((hours) => {
            let display = '—';
            if (hours > 0) {
              if (isHours) display = fmtH(hours);
              else if (isDays) display = fmtD(hours);
              else if (isPct) display = fmtPct(hours, grandTotal);
            }
            const colWidth = (3 / (4 * (rows.length + 1))) * 100;
            const cellStyle = isMissingId ? 'font-semibold text-gray-700 dark:text-white/80 text-xs' : 'text-gray-700 dark:text-white/80 text-xs';
            html += `<td class="text-right py-2 px-3 ${cellStyle}" style="width: ${colWidth}%">${display}</td>`;
          });

          let totalDisplay = '—';
          if (monthTotal > 0) {
            if (isHours) totalDisplay = fmtH(monthTotal);
            else if (isDays) totalDisplay = fmtD(monthTotal);
            else if (isPct) totalDisplay = fmtPct(monthTotal, grandTotal);
          }

          const totalColWidth = (3 / (4 * (rows.length + 1))) * 100;
          html += `<td class="text-right py-2 px-3 font-semibold text-gray-900 dark:text-white text-xs" style="width: ${totalColWidth}%">${totalDisplay}</td>
        </tr>`;
        });
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      el.innerHTML = html;
    }

    function switchView(view) {
      console.log('switchView called:', view, {
        renderedViews,
        currentOverviewStatus: document.getElementById('overviewView')?.classList.contains('hidden'),
        currentBytaskStatus: document.getElementById('bytaskView')?.classList.contains('hidden')
      });

      document.querySelectorAll('.view-toggle-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-view="${view}"]`).classList.add('active');

      const overviewView = document.getElementById('overviewView');
      const bytaskView = document.getElementById('bytaskView');

      overviewView.classList.add('hidden');
      bytaskView.classList.add('hidden');

      if (view === 'overview') {
        overviewView.classList.remove('hidden');
        if (!renderedViews.overview) {
          console.log('First time rendering overview view - calling all render functions');
          renderCombinedGraph();
          renderLegend();
          renderLinearChart();
          renderRepartitionChart();
          renderWeeklyTable();
          renderTaskLegend();
          renderBurnoutBadge();
          renderedViews.overview = true;
          console.log('Overview view rendered');
        } else {
          console.log('Overview view already rendered, skipping');
        }
      } else if (view === 'bytask') {
        bytaskView.classList.remove('hidden');
        if (!renderedViews.bytask) {
          renderByTaskView(activeTaskIndex);
          renderedViews.bytask = true;
        }
      }
    }


    function updateMonthLabel() {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const label = `${monthNames[linearViewMonth]} ${linearViewYear}`;
      const monthLabelEl = document.getElementById('monthLabel');
      monthLabelEl.textContent = label;

      const tooltipEl = document.getElementById('monthTooltip');
      tooltipEl.textContent = 'go back';

      monthLabelEl.addEventListener('mouseenter', () => {
        tooltipEl.classList.remove('opacity-0');
      });
      monthLabelEl.addEventListener('mouseleave', () => {
        tooltipEl.classList.add('opacity-0');
      });
    }

    function prevMonth() {
      linearViewMonth--;
      if (linearViewMonth < 0) {
        linearViewMonth = 11;
        linearViewYear--;
      }
      renderLinearChart();
      renderRepartitionChart();
      renderWeeklyTable();
      renderTaskLegend();
      renderBurnoutBadge();
      if (!document.getElementById('bytaskView').classList.contains('hidden')) {
        renderByTaskView(activeTaskIndex);
      }
    }

    function nextMonth() {
      const today = new Date();
      if (linearViewYear > today.getFullYear() || (linearViewYear === today.getFullYear() && linearViewMonth >= today.getMonth())) {
        return;
      }
      linearViewMonth++;
      if (linearViewMonth > 11) {
        linearViewMonth = 0;
        linearViewYear++;
      }
      renderLinearChart();
      renderRepartitionChart();
      renderWeeklyTable();
      renderTaskLegend();
      renderBurnoutBadge();
      if (!document.getElementById('bytaskView').classList.contains('hidden')) {
        renderByTaskView(activeTaskIndex);
      }
    }

    function getAllDates() {
      const dates = Object.keys(completions)
        .filter(d => d <= todayStr())
        .sort();
      return dates;
    }

    function getDayLabelsHTML() {
      const dayLabelHeight = MONTH_LABELS_HEIGHT + 7 * (CELL_SIZE + CELL_MARGIN) + 20;
      let html = `<svg width="30" height="${dayLabelHeight}" viewBox="0 0 30 ${dayLabelHeight}" class="text-gray-900 dark:text-white/70" style="min-height: ${dayLabelHeight}px;">`;

      DAY_LABELS.forEach((label, i) => {
        const y = MONTH_LABELS_HEIGHT + i * (CELL_SIZE + CELL_MARGIN) + CELL_SIZE / 2 + 3;
        html += `<text x="25" y="${y}" class="day-label">${label}</text>`;
      });

      html += `</svg>`;
      return html;
    }

    // ── Handle Query Parameters ──────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    const viewParam = urlParams.get('view');
    const taskParam = urlParams.get('task');
    const monthParam = urlParams.get('month');
    const yearParam = urlParams.get('year');

    // Set month/year if provided from index.html
    if (monthParam !== null && yearParam !== null) {
      const month = parseInt(monthParam, 10);
      const year = parseInt(yearParam, 10);
      if (!isNaN(month) && !isNaN(year)) {
        linearViewMonth = month;
        linearViewYear = year;
      }
    }

    // ── Init ──────────────────────────────────────────────
    // Only render the default active view (overview) on page load
    console.log('=== PAGE INIT START ===');
    console.log('Initial state:', {
      tasksCount: tasks.length,
      completionsCount: Object.keys(completions).length,
      linearViewYear,
      linearViewMonth
    });

    renderCombinedGraph();
    renderLegend();
    renderLinearChart();
    renderRepartitionChart();
    renderWeeklyTable();
    renderTaskLegend();
    renderBurnoutBadge();
    updateMonthLabel();
    renderedViews.overview = true;

    console.log('=== PAGE INIT END ===');

    if (viewParam === 'bytask' && taskParam !== null) {
      const taskIndex = parseInt(taskParam, 10);
      if (!isNaN(taskIndex)) {
        setTimeout(() => {
          switchView('bytask');
          setTimeout(() => renderByTaskView(taskIndex), 0);
        }, 0);
      }
    }

    // Month navigation event listeners
    document.getElementById('prevMonthBtn').addEventListener('click', prevMonth);
    document.getElementById('nextMonthBtn').addEventListener('click', nextMonth);

    // Month label click handler - navigate back to index.html with selected month
    const monthLabelEl = document.getElementById('monthLabel');
    monthLabelEl.removeEventListener('click', openMonthSummaryModal);
    monthLabelEl.addEventListener('click', () => {
      window.location.href = `./index.html?month=${linearViewMonth}&year=${linearViewYear}`;
    });

    // Helper function to get week of year
    function getWeekOfYear(date) {
      const firstDay = new Date(date.getFullYear(), 0, 1);
      const pastDaysOfYear = (date - firstDay) / 86400000;
      return Math.ceil((pastDaysOfYear + firstDay.getDay() + 1) / 7);
    }

    // Helper function to add ordinal suffix
    function ordinal(n) {
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    // Formatting functions for summary modes
    function fmtH(h) {
      return h.toFixed(2) + 'h';
    }

    function fmtD(h) {
      const days = (h / maxCap).toFixed(2);
      return days + 'd';
    }

    function hoursToDay(h) {
      return (h / maxCap).toFixed(1);
    }

    function fmtPct(h, total) {
      if (total === 0) return '0%';
      return ((h / total) * 100).toFixed(0) + '%';
    }

    function fmtVal(h, total) {
      if (summaryCachingMode === 'hours') return fmtH(h);
      if (summaryCachingMode === 'days') return fmtD(h);
      if (summaryCachingMode === 'pct') return fmtPct(h, total);
      return fmtH(h);
    }

    // Render summary content with current mode
    function renderSummaryContent(options = {}) {
      const { showBurnout = true } = options;
      const daysInMonth = new Date(linearViewYear, linearViewMonth + 1, 0).getDate();
      const firstDay = new Date(linearViewYear, linearViewMonth, 1);
      let startDow = firstDay.getDay() - 1;
      if (startDow < 0) startDow = 6;
      const shortMonthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      // Group days by calendar row (week)
      const weekGroups = {};
      const todayS = todayStr();
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${linearViewYear}-${String(linearViewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (ds > todayS) break;
        const row = Math.floor((d - 1 + startDow) / 7);
        if (!weekGroups[row]) weekGroups[row] = [];
        weekGroups[row].push(ds);
      }

      const rows = Object.keys(weekGroups).sort((a,b) => a-b).map(r => weekGroups[r]);

      if (rows.length === 0) {
        return `<p class="text-sm text-gray-400 dark:text-white/40 text-center py-6">No data for this month yet.</p>`;
      }

      const isHours = summaryCachingMode === 'hours';
      const isDays = summaryCachingMode === 'days';
      const isPct = summaryCachingMode === 'pct';

      // Mode toggle buttons
      let html = `<div class="flex justify-center mb-4">
        <div class="inline-flex rounded-lg bg-black/5 dark:bg-white/5 p-0.5">
          <button onclick="setSummaryMode('hours')" class="px-3 py-1 text-xs font-medium rounded-md transition-colors ${isHours ? 'bg-white dark:bg-white/15 text-gray-900 dark:text-white shadow-sm' : 'text-gray-400 dark:text-white/40 hover:text-gray-600 dark:hover:text-white/60'}">Hours</button>
          <button onclick="setSummaryMode('days')" class="px-3 py-1 text-xs font-medium rounded-md transition-colors ${isDays ? 'bg-white dark:bg-white/15 text-gray-900 dark:text-white shadow-sm' : 'text-gray-400 dark:text-white/40 hover:text-gray-600 dark:hover:text-white/60'}">Days</button>
          <button onclick="setSummaryMode('pct')" class="px-3 py-1 text-xs font-medium rounded-md transition-colors ${isPct ? 'bg-white dark:bg-white/15 text-gray-900 dark:text-white shadow-sm' : 'text-gray-400 dark:text-white/40 hover:text-gray-600 dark:hover:text-white/60'}">%</button>
        </div>
      </div>`;

      if (isHours) {
        html += `<p class="text-[10px] text-gray-400 dark:text-white/30 text-center mb-3">0.25 = 15min · 0.5 = 30min · 0.75 = 45min</p>`;
      } else if (isDays) {
        html += `<p class="text-[10px] text-gray-400 dark:text-white/30 text-center mb-3">1 day = ${maxCap}h (daily cap)</p>`;
      } else {
        html += `<p class="text-[10px] text-gray-400 dark:text-white/30 text-center mb-3">share of total hours per week / month</p>`;
      }

      // Per-week sections
      const monthTaskTotals = tasks.map(() => 0);
      let monthGrandTotal = 0;

      rows.forEach((weekDates, wi) => {
        const first = parseDate(weekDates[0]);
        const last = parseDate(weekDates[weekDates.length - 1]);
        const fd = first.getDate(), ld = last.getDate();
        const range = first.getMonth() === last.getMonth()
          ? `${shortMonthNames[first.getMonth()]} ${fd}${ordinal(fd)}–${ld}${ordinal(ld)}`
          : `${shortMonthNames[first.getMonth()]} ${fd}${ordinal(fd)} – ${shortMonthNames[last.getMonth()]} ${ld}${ordinal(ld)}`;
        const weekNum = getWeekOfYear(first);

        const taskHours = tasks.map((_, ti) =>
          weekDates.reduce((sum, ds) => sum + getHours(ds, ti), 0)
        );
        const weekTotal = taskHours.reduce((a, b) => a + b, 0);
        taskHours.forEach((h, i) => { monthTaskTotals[i] += h; });
        monthGrandTotal += weekTotal;

        html += `<div class="mb-4 pb-4 border-b border-gray-100 dark:border-white/5">`;
        html += `<div class="flex items-center justify-between mb-2.5">
          <span class="text-[11px] font-semibold text-gray-400 dark:text-white/40 uppercase tracking-wider">W${weekNum} · ${range}</span>
          <span class="text-xs font-bold ${weekTotal > 0 ? 'text-gray-700 dark:text-white/80' : 'text-gray-300 dark:text-white/20'}">${isPct ? fmtH(weekTotal) : fmtVal(weekTotal, weekTotal)}</span>
        </div>`;
        html += `<div class="grid grid-cols-4 gap-2">`;
        tasks.forEach((t, ti) => {
          const h = taskHours[ti];
          const emptyColor = darkMode ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.10)';
          html += `<div class="flex flex-col items-center gap-1 py-2 px-1 rounded-xl bg-black/[0.03] dark:bg-white/[0.03]">
            <div class="w-2 h-2 rounded-full" style="background:${h > 0 ? t.color : emptyColor}"></div>
            <span class="text-xs font-medium ${h > 0 ? 'text-gray-700 dark:text-white/80' : 'text-gray-300 dark:text-white/20'}">${fmtVal(h, weekTotal)}</span>
          </div>`;
        });
        html += `</div></div>`;
      });

      // Burnout info
      if (showBurnout) {
        let burnoutCount = 0, exceededTotal = 0;
        const yearStr = linearViewYear.toString();
        const monthStr = String(linearViewMonth + 1).padStart(2, '0');
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = `${yearStr}-${monthStr}-${String(d).padStart(2,'0')}`;
          if (ds > todayStr()) break;
          const tot = getTotalHours(ds);
          if (tot > maxCap) { burnoutCount++; exceededTotal += tot - maxCap; }
        }
        if (burnoutCount > 0) {
          html += `<div class="mt-4 flex justify-center">
            <span class="inline-flex items-center gap-1.5 text-xs bg-red-500/20 text-red-600 dark:text-red-400 px-3 py-1 rounded-full font-medium">
              🔥 ${burnoutCount} burnout day${burnoutCount > 1 ? 's' : ''} +${exceededTotal.toFixed(2)}h over cap
            </span>
          </div>`;
        }
      }

      return html;
    }

    function setSummaryMode(mode) {
      summaryCachingMode = mode;
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const title = `${monthNames[linearViewMonth]} ${linearViewYear}`;
      MonthModal.setContent(title, renderSummaryContent());
      renderWeeklyTable();
    }

    // Month label click - open modal with detailed breakdown
    function openMonthSummaryModal() {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const title = `${monthNames[linearViewMonth]} ${linearViewYear}`;
      const content = renderSummaryContent();
      MonthModal.open(title, content);
    }

    // Re-render when data changes in another tab
    window.addEventListener('storage', () => {
      tasks = loadJSON('dt_tasks', DEFAULT_TASKS);
      completions = loadJSON('dt_completions', {});
      maxCap = parseFloat(localStorage.getItem('dt_maxCap')) || 7.5;
      darkMode = localStorage.getItem('dt_darkMode') !== 'false';
      applyDarkMode();
      // Mark all views as needing re-render when data changes
      renderedViews = {};
      // Re-render only the currently visible view
      const activeBtn = document.querySelector('.view-toggle-btn.active');
      if (activeBtn) {
        switchView(activeBtn.dataset.view);
      }
    });
  </script>
</body>
</html>
